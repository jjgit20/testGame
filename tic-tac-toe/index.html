<!DOCTYPE html>
<html lang = "ko">
    <head>
        <meta charset = "UTF-8">
        <title>Tic-Tac-Toe</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body>
        <div class="ui">
            <label>Grid Size: </label>
            <input type="number" id="gridSize" min="3" max="9" value="3">
            <button onclick="start()">Apply and Restart</button>
        </div>
        <div class="status" id="status">
            <label>Turn: </label>
            <span id="turn">Player</span>
        </div>
        <div class="board" id="board"></div>
        <script src="script.js"></script>
    </body>
</html>
