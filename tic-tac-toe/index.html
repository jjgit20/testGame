<!DOCTYPE html>
<html lang = "ko">
    <head>
        <meta charset = "UTF-8">
        <title>Tic-Tac-Toe</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body>
        <div class="ui">
            <label>Grid Size: </label>
            <input type="number" id="gridSize" min="3" max="9" value="3">
        </div>
        <div class="ui">
            <label>Starting Player: </label>
            <!-- <select id="startPlayer">
                <option value="Player">Player</option>
                <option value="Computer">Computer</option>
            </select> -->
            <div class="startingUnit">
                <button type="button" id="btnPlayer" onclick="setPlayer('Player')">Player</button>
                <button type="button" id="btnComputer" onclick="setPlayer('Computer')">Computer</button>
                <input type="hidden" id="selectedUnit" value="Player">
            </div>
        </div>
        <div class="ui">
            <button onclick="start()">Apply and Restart</button>
        </div>
        <div class="status" id="status">
            <label>Turn: </label>
            <span id="turn">Player</span>
        </div>
        <div class="board" id="board"></div>
        <script src="script.js"></script>
    </body>
</html>
